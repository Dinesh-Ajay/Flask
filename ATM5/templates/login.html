{% extends 'base.html' %}

{% block title %}
Login Page
{% endblock %}

{% block extracss %}
<link rel="stylesheet" href="../static/css/base.css">
{% endblock %}

{% block content %}
    <H1>Login to the ATM</H1>
    <form method="POST">
        <label>Enter the mail:</label>
        <input type="email", name="email">
        <br><br>
        <label>Enter password:</label>
        <input type="password", name="pin">
        <br>
        <input type="submit" value="Login"><br>
        <p><br><a href="/forgotpin">Forgot Pin</a></p>
        <p><br><a href="/register">Create an account</a></p>
    </form>
{% if info %}    
    <h3>{{info}}</h3>
{% endif %}    
{% endblock %}
