{% extends 'base.html' %}

{% block title %}
Register Page
{% endblock %}

{% block extracss %}
<link rel="stylesheet" href="../static/css/base.css">
{% endblock %}

{% block content %}
    <h1>Register to the ATM</h1>
    <form method="POST">
        <label for="uname">Username:</label>
        <input type="text", name="uname">
        <br><br>
        <label for="email">Enter Email: </label>
        <input type="email", name="email">
        <br><br>
        <label for="pin">Enter password: </label>
        <input type="password", name="pin">
        <br><br>
        <input type="submit", value="Register">

    </from>
    <p><br>Already Registered <a href="/login">Login</a></p><br>
{% if info %}    
    <h3>{{info}}</h3>
{% endif %}
{% endblock %}
