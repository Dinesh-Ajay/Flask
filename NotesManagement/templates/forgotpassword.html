{% extends 'base.html' %}


{% block title %}
Forgot Password
{% endblock %}


{% block content %}

<div class="page-container">

    <div class="card">


        <!-- Logo -->
        <div class="logo">
            🔑
        </div>


        <!-- Heading -->
        <h1>
            Forgot Password?
        </h1>


        <p class="subtitle">
            Enter your registered email address and we'll
            send you a password reset link.
        </p>


        <!-- Info Message -->
        {% if info %}

            <div class="info">
                {{ info }}
            </div>

        {% endif %}


        <!-- Forgot Password Form -->
        <form
            action="{{ url_for('forgotpassword') }}"
            method="POST"
        >


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your registered email"
                    required
                >

            </div>


            <button type="submit">
                Send Reset Link
            </button>


        </form>


        <!-- Back to Login -->
        <div class="back-login">

            <a href="{{ url_for('login') }}">
                ← Back to Login
            </a>

        </div>


    </div>

</div>

{% endblock %}
