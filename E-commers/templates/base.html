<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Notes Management
        {% endblock %}
    </title>

    <!-- Main CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/base.css') }}">

    <!-- Optional page-specific CSS -->
    {% block extracss %}
    {% endblock %}

</head>


<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <nav>

        <div class="nav-logo">
            Notes Management
        </div>

        <div class="nav-links">

            {% if session.get("username") %}

                <a href="/dashboard/{{ session.get('username') }}">
                    Home
                </a>

                <a href="/logout">
                    Logout
                </a>

            {% else %}

                <a href="/login">
                    Login
                </a>

                <a href="/register">
                    Register
                </a>

            {% endif %}

        </div>

    </nav>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main>

        {% block content %}
        {% endblock %}

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        Copyrights@2026

    </footer>


</body>

</html>
