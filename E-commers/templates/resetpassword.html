{% extends 'base.html' %}


{% block title %}
Reset Password
{% endblock %}


{% block content %}

<div class="page-container">

    <div class="card">


        <!-- Logo -->
        <div class="logo">
            🔐
        </div>


        <!-- Heading -->
        <h1>
            Reset Password
        </h1>


        <p class="subtitle">
            Create a new password for your account.
        </p>


        <!-- Info Message -->
        {% if info %}

            <div class="info">
                {{ info }}
            </div>

        {% endif %}


        <!-- Email -->
        {% if email %}

            <p class="email-text">

                Resetting password for:

                <strong>
                    {{ email }}
                </strong>

            </p>

        {% endif %}


        <!-- Reset Password Form -->
        <form
            action=""
            method="POST"
        >


            <!-- New Password -->
            <div class="form-group">

                <label for="password">
                    New Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter new password"
                    required
                >

            </div>


            <!-- Confirm Password -->
            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    required
                >

            </div>


            <!-- Reset Button -->
            <button type="submit">
                Reset Password
            </button>


        </form>


        <!-- Back to Login -->
        <div class="back-login">

            <a href="{{ url_for('login') }}">
                ← Back to Login
            </a>

        </div>


    </div>

</div>

{% endblock %}
