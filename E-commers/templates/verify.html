{% extends 'base.html' %}


{% block title %}
Verify Account
{% endblock %}


{% block content %}

<div class="page-container">

    <div class="card">


        <!-- Logo -->
        <div class="logo">
            ✓
        </div>


        <h1>
            Verify Account
        </h1>


        <p class="subtitle">
            Please verify your account to continue.
        </p>


        {% if info %}

            <div class="info">
                {{ info }}
            </div>

        {% endif %}


        <div class="back-login">

            <a href="{{ url_for('login') }}">
                ← Back to Login
            </a>

        </div>


    </div>

</div>

{% endblock %}
